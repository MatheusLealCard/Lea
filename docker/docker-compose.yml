version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: meu_postgres
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: lea_v1
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"

volumes:
  pgdata: